<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description">
  <title id="title">Power BI Dashboard Comparator Architecture</title>
  <desc id="description">Layered architecture showing the frontend, FastAPI jobs, workflow orchestration, Playwright and Power BI capture, Gemini enrichment, functional scenarios, deterministic comparison, and report outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#46627f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".16"/>
    </filter>
    <style>
      .title { font: 700 28px Segoe UI, Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 15px Segoe UI, Arial, sans-serif; fill: #52606d; }
      .layer-title { font: 700 16px Segoe UI, Arial, sans-serif; fill: #214766; }
      .box-title { font: 700 15px Segoe UI, Arial, sans-serif; fill: #102a43; }
      .box-text { font: 13px Segoe UI, Arial, sans-serif; fill: #334e68; }
      .small { font: 12px Segoe UI, Arial, sans-serif; fill: #486581; }
      .layer { fill: #eef5fb; stroke: #8eb3d3; stroke-width: 1.5; rx: 14; }
      .box { fill: #ffffff; stroke: #4779a8; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .external { fill: #fff5e3; stroke: #c58a2b; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .output { fill: #eaf8ef; stroke: #4a9b69; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .arrow { stroke: #46627f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#fbfdff"/>
  <text x="800" y="46" text-anchor="middle" class="title">Power BI Dashboard Comparator</text>
  <text x="800" y="73" text-anchor="middle" class="subtitle">Layered architecture and end-to-end evidence flow</text>

  <!-- Presentation -->
  <rect x="60" y="105" width="1480" height="105" class="layer"/>
  <text x="82" y="132" class="layer-title">1. PRESENTATION</text>
  <rect x="105" y="148" width="350" height="43" class="box"/>
  <text x="280" y="168" text-anchor="middle" class="box-title">Web UI</text>
  <text x="280" y="185" text-anchor="middle" class="small">Frontend/index.html + static/app.js</text>
  <rect x="625" y="148" width="350" height="43" class="box"/>
  <text x="800" y="168" text-anchor="middle" class="box-title">CLI</text>
  <text x="800" y="185" text-anchor="middle" class="small">Backend/cli.py</text>
  <rect x="1145" y="148" width="300" height="43" class="box"/>
  <text x="1295" y="168" text-anchor="middle" class="box-title">User</text>
  <text x="1295" y="185" text-anchor="middle" class="small">submits comparison jobs</text>

  <!-- Service -->
  <rect x="60" y="235" width="1480" height="105" class="layer"/>
  <text x="82" y="262" class="layer-title">2. APPLICATION SERVICE</text>
  <rect x="230" y="278" width="380" height="43" class="box"/>
  <text x="420" y="298" text-anchor="middle" class="box-title">FastAPI API</text>
  <text x="420" y="315" text-anchor="middle" class="small">Backend/api.py</text>
  <rect x="730" y="278" width="380" height="43" class="box"/>
  <text x="920" y="298" text-anchor="middle" class="box-title">Job manager</text>
  <text x="920" y="315" text-anchor="middle" class="small">status, progress, output retention</text>

  <!-- Orchestration -->
  <rect x="60" y="365" width="1480" height="115" class="layer"/>
  <text x="82" y="392" class="layer-title">3. ORCHESTRATION</text>
  <rect x="155" y="408" width="290" height="45" class="box"/>
  <text x="300" y="428" text-anchor="middle" class="box-title">ADK Sequential Workflow</text>
  <text x="300" y="445" text-anchor="middle" class="small">Backend/workflow.py</text>
  <rect x="540" y="408" width="210" height="45" class="box"/>
  <text x="645" y="428" text-anchor="middle" class="box-title">Capture</text>
  <text x="645" y="445" text-anchor="middle" class="small">states + screenshots</text>
  <rect x="845" y="408" width="210" height="45" class="box"/>
  <text x="950" y="428" text-anchor="middle" class="box-title">Validate</text>
  <text x="950" y="445" text-anchor="middle" class="small">schema + readiness</text>
  <rect x="1150" y="408" width="210" height="45" class="box"/>
  <text x="1255" y="428" text-anchor="middle" class="box-title">Compare / Report</text>
  <text x="1255" y="445" text-anchor="middle" class="small">deterministic output</text>

  <!-- Acquisition -->
  <rect x="60" y="505" width="1480" height="150" class="layer"/>
  <text x="82" y="532" class="layer-title">4. POWER BI ACQUISITION</text>
  <rect x="105" y="548" width="230" height="70" class="box"/>
  <text x="220" y="574" text-anchor="middle" class="box-title">Discovery</text>
  <text x="220" y="594" text-anchor="middle" class="small">workspace/report lookup</text>
  <text x="220" y="610" text-anchor="middle" class="small">Backend/discovery.py</text>
  <rect x="390" y="548" width="230" height="70" class="box"/>
  <text x="505" y="574" text-anchor="middle" class="box-title">Playwright engine</text>
  <text x="505" y="594" text-anchor="middle" class="small">Backend/browser.py</text>
  <text x="505" y="610" text-anchor="middle" class="small">authenticated browser</text>
  <rect x="675" y="548" width="230" height="70" class="box"/>
  <text x="790" y="574" text-anchor="middle" class="box-title">DOM inventory</text>
  <text x="790" y="594" text-anchor="middle" class="small">pages, filters, visuals</text>
  <text x="790" y="610" text-anchor="middle" class="small">bounds and accessibility</text>
  <rect x="960" y="548" width="230" height="70" class="box"/>
  <text x="1075" y="574" text-anchor="middle" class="box-title">Readiness</text>
  <text x="1075" y="594" text-anchor="middle" class="small">render stability</text>
  <text x="1075" y="610" text-anchor="middle" class="small">fail-fast incomplete visuals</text>
  <rect x="1245" y="548" width="230" height="70" class="box"/>
  <text x="1360" y="574" text-anchor="middle" class="box-title">Evidence capture</text>
  <text x="1360" y="594" text-anchor="middle" class="small">screenshots + exports</text>
  <text x="1360" y="610" text-anchor="middle" class="small">filters and page states</text>

  <!-- AI and validation -->
  <rect x="60" y="680" width="710" height="190" class="layer"/>
  <text x="82" y="707" class="layer-title">5A. AI EVIDENCE ENRICHMENT</text>
  <rect x="105" y="725" width="250" height="65" class="box"/>
  <text x="230" y="750" text-anchor="middle" class="box-title">Gemini / Vertex AI</text>
  <text x="230" y="770" text-anchor="middle" class="small">Backend/agents.py</text>
  <rect x="405" y="725" width="285" height="65" class="box"/>
  <text x="547" y="750" text-anchor="middle" class="box-title">Visual extraction</text>
  <text x="547" y="770" text-anchor="middle" class="small">title, type, rendering, bounds</text>
  <rect x="255" y="815" width="285" height="35" class="box"/>
  <text x="397" y="837" text-anchor="middle" class="small">schema validation + retry/backoff</text>

  <rect x="830" y="680" width="710" height="190" class="layer"/>
  <text x="852" y="707" class="layer-title">5B. FUNCTIONAL VALIDATION</text>
  <rect x="865" y="725" width="190" height="65" class="box"/>
  <text x="960" y="750" text-anchor="middle" class="box-title">Scenario 01</text>
  <text x="960" y="770" text-anchor="middle" class="small">headers + hierarchy</text>
  <rect x="1090" y="725" width="190" height="65" class="box"/>
  <text x="1185" y="750" text-anchor="middle" class="box-title">Scenario 02</text>
  <text x="1185" y="770" text-anchor="middle" class="small">single filter</text>
  <rect x="1315" y="725" width="190" height="65" class="box"/>
  <text x="1410" y="750" text-anchor="middle" class="box-title">Scenario 03</text>
  <text x="1410" y="770" text-anchor="middle" class="small">multiple filters</text>
  <rect x="1000" y="815" width="370" height="35" class="box"/>
  <text x="1185" y="837" text-anchor="middle" class="small">Scenario 04 drill behavior is legacy-compatible</text>

  <!-- Comparison -->
  <rect x="60" y="895" width="1480" height="105" class="layer"/>
  <text x="82" y="922" class="layer-title">6. DETERMINISTIC COMPARISON</text>
  <rect x="150" y="938" width="310" height="43" class="box"/>
  <text x="305" y="958" text-anchor="middle" class="box-title">State alignment and statuses</text>
  <text x="305" y="975" text-anchor="middle" class="small">Backend/comparison.py</text>
  <rect x="645" y="938" width="310" height="43" class="box"/>
  <text x="800" y="958" text-anchor="middle" class="box-title">Visual/filter comparison</text>
  <text x="800" y="975" text-anchor="middle" class="small">PASS / FAIL / UNVERIFIED</text>
  <rect x="1140" y="938" width="310" height="43" class="box"/>
  <text x="1295" y="958" text-anchor="middle" class="box-title">Evidence pairing</text>
  <text x="1295" y="975" text-anchor="middle" class="small">Base vs Compare</text>

  <!-- Outputs -->
  <rect x="60" y="1025" width="1480" height="110" class="layer"/>
  <text x="82" y="1052" class="layer-title">7. OUTPUTS</text>
  <rect x="120" y="1068" width="200" height="42" class="output"/>
  <text x="220" y="1093" text-anchor="middle" class="box-title">JSON evidence</text>
  <rect x="380" y="1068" width="200" height="42" class="output"/>
  <text x="480" y="1093" text-anchor="middle" class="box-title">Excel workbook</text>
  <rect x="640" y="1068" width="200" height="42" class="output"/>
  <text x="740" y="1093" text-anchor="middle" class="box-title">DOCX report</text>
  <rect x="900" y="1068" width="200" height="42" class="output"/>
  <text x="1000" y="1093" text-anchor="middle" class="box-title">Screenshots</text>
  <rect x="1160" y="1068" width="200" height="42" class="output"/>
  <text x="1260" y="1093" text-anchor="middle" class="box-title">Timing JSONL</text>
  <rect x="1420" y="1068" width="100" height="42" class="output"/>
  <text x="1470" y="1093" text-anchor="middle" class="box-title">jobs/</text>

  <!-- Flow arrows -->
  <path d="M280 191 L420 278" class="arrow"/>
  <path d="M800 191 L300 408" class="arrow"/>
  <path d="M420 321 L420 365" class="arrow"/>
  <path d="M920 321 L920 408" class="arrow"/>
  <path d="M300 453 L220 548" class="arrow"/>
  <path d="M645 453 L505 548" class="arrow"/>
  <path d="M505 618 L790 680" class="arrow"/>
  <path d="M790 618 L790 680" class="arrow"/>
  <path d="M1360 618 L1185 725" class="arrow"/>
  <path d="M505 618 L960 725" class="arrow"/>
  <path d="M547 790 L547 938" class="arrow"/>
  <path d="M1185 850 L1185 938" class="arrow"/>
  <path d="M800 981 L800 1025" class="arrow"/>
  <path d="M305 981 L305 1025" class="arrow"/>
  <path d="M1295 981 L1295 1025" class="arrow"/>
  <path d="M220 1110 L1470 1110" class="arrow dashed"/>

  <!-- External systems -->
  <rect x="1120" y="235" width="370" height="82" class="external"/>
  <text x="1305" y="261" text-anchor="middle" class="box-title">External systems</text>
  <text x="1305" y="281" text-anchor="middle" class="box-text">Power BI A (Base) + Power BI B (GCP)</text>
  <text x="1305" y="301" text-anchor="middle" class="small">Vertex AI + authenticated storage state</text>
  <path d="M1120 276 L505 548" class="arrow dashed"/>
</svg>
