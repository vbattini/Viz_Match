[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-dashboard-comparator"
version = "0.1.0"
description = "Compare Power BI dashboards using Playwright, Google ADK, and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "google-adk>=1.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "playwright>=1.50.0",
    "python-docx>=1.1.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
powerbi-compare = "powerbi_dashboard_comparator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powerbi_dashboard_comparator = ["static/*.png", "assets/*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
